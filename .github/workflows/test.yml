# Run the test suite (tests/, see TESTING.md) on every PR and every push to main or dev.
#
# Two jobs so the fast one reports first: `build` renders every page and checks links (seconds,
# no network beyond pip); `browser` opens every page in headless Chromium at phone and desktop
# width against the live API (a couple of minutes). Neither needs a secret. This workflow only
# reports; whether it is a required check is a branch rule the maintainer sets.
name: test

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -m "not browser"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -m browser
