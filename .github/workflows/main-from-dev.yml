# main only takes changes that have been through the preview channel: a PR into main must come
# from this repo's `dev` branch. Work goes feature branch → dev (dev.wardwise.org) → main.
# The `main-from-dev` check is required on main in the branch protection settings, so a PR from
# any other branch can't be merged (an admin can still override in an emergency).
name: main-from-dev

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  main-from-dev:
    runs-on: ubuntu-latest
    steps:
      - name: PRs into main must come from dev
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" = "dev" ] && [ "$HEAD_REPO" = "$BASE_REPO" ]; then
            echo "ok: promoting dev → main"
          else
            echo "::error::PRs into main must come from the dev branch (this one is from $HEAD_REPO:$HEAD_REF). Open your PR into dev instead; dev → main is the release."
            exit 1
          fi
